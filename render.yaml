services:
  - type: web
    name: netrios-news-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Tarefas agendadas (auto-scan + fechamento de billing) sao singleton: o
      # Supabase e compartilhado entre os ambientes e o gatilho do scan e a
      # coluna last_check, entao dois schedulers se revezam e o feed do cliente
      # recebe resultado de codigo de teste. Sem esta variavel, so NODE_ENV=
      # production roda — e este arquivo descreve producao. Em staging, deixar
      # ausente (ou 'false'); por 'true' so pra testar o scan de proposito.
      - key: AUTO_SCAN_ENABLED
        value: "true"
      - key: PORT
        value: "3000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SEARCH_BACKEND
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_ZONE
        sync: false
      - key: SENTRY_DSN
        sync: false
    healthCheckPath: /health
